{% load i18n %}{% if cl.search_fields %}<div id="toolbar"><form id="changelist-search" method="get" role="search"><div><label class="sr-only" for="searchbar">{% trans "Search" %}</label><input type="search" size="40" name="{{ search_var }}" value="{{ cl.query }}" id="searchbar" placeholder="{% if cl.opts.model_name == 'event' %}{% trans 'Search by event title, organization or responsible person…' %}{% else %}{% trans 'Search records…' %}{% endif %}"{% if cl.search_help_text %} aria-describedby="searchbar_helptext"{% endif %}><button type="submit">{% trans "Search" %}</button>{% if cl.query %}<a class="admin-search-clear" href="?">{% trans "Clear" %}</a>{% endif %}{% for pair in cl.params.items %}{% if pair.0 != search_var %}<input type="hidden" name="{{ pair.0 }}" value="{{ pair.1 }}">{% endif %}{% endfor %}</div>{% if cl.search_help_text %}<p class="help" id="searchbar_helptext">{{ cl.search_help_text }}</p>{% endif %}</form></div>{% endif %}
