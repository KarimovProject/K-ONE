<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0a2244" />
      <stop offset="100%" stop-color="#071a33" />
    </radialGradient>
    <linearGradient id="gridGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(22, 188, 235, 0.05)" />
      <stop offset="50%" stop-color="rgba(20, 92, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(22, 188, 235, 0.05)" />
    </linearGradient>
    
    <!-- Central Asian geometry motifs (very subtle) -->
    <pattern id="motif" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M60 0 L120 60 L60 120 L0 60 Z" fill="none" stroke="rgba(22, 188, 235, 0.03)" stroke-width="1"/>
      <circle cx="60" cy="60" r="40" fill="none" stroke="rgba(20, 92, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <style>
      .node { fill: #16bceb; opacity: 0.8; }
      .node-pulse { fill: #145cff; animation: pulse 4s infinite alternate ease-in-out; }
      .line { stroke: rgba(20, 92, 255, 0.2); stroke-width: 1.5; stroke-dasharray: 4 6; animation: flow 20s linear infinite; }
      .solid-line { stroke: rgba(22, 188, 235, 0.15); stroke-width: 1; }
      
      @keyframes pulse {
        0% { r: 3px; opacity: 0.4; }
        100% { r: 6px; opacity: 1; box-shadow: 0 0 10px #16bceb; }
      }
      
      @keyframes flow {
        to { stroke-dashoffset: -200; }
      }
      
      @keyframes float {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-15px) translateX(10px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      
      .constellation { animation: float 15s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGlow)" />
  <rect width="100%" height="100%" fill="url(#motif)" />
  
  <g class="constellation" transform="translate(100, 100)">
    <!-- Nodes -->
    <circle cx="200" cy="150" r="4" class="node-pulse" />
    <circle cx="450" cy="200" r="3" class="node" />
    <circle cx="600" cy="100" r="5" class="node-pulse" style="animation-delay: 1s;" />
    <circle cx="300" cy="350" r="3" class="node" />
    <circle cx="550" cy="450" r="4" class="node-pulse" style="animation-delay: 2s;" />
    <circle cx="800" cy="300" r="6" class="node" />
    <circle cx="700" cy="550" r="3" class="node-pulse" style="animation-delay: 0.5s;" />
    
    <!-- Lines -->
    <path d="M200 150 L450 200 L600 100" fill="none" class="solid-line" />
    <path d="M200 150 L300 350 L550 450 L700 550" fill="none" class="line" />
    <path d="M450 200 L800 300 L700 550" fill="none" class="solid-line" />
    <path d="M600 100 L800 300" fill="none" class="line" />
    <path d="M300 350 L450 200" fill="none" class="line" />
  </g>
  
  <g class="constellation" transform="translate(-150, 400)" style="animation-delay: 3s; animation-duration: 20s;">
    <!-- Lower left network -->
    <circle cx="250" cy="100" r="4" class="node" />
    <circle cx="400" cy="250" r="5" class="node-pulse" />
    <circle cx="150" cy="300" r="3" class="node" />
    <circle cx="350" cy="400" r="4" class="node-pulse" style="animation-delay: 1.5s;" />
    
    <path d="M250 100 L400 250 L350 400" fill="none" class="solid-line" />
    <path d="M250 100 L150 300 L350 400" fill="none" class="line" />
    <path d="M150 300 L400 250" fill="none" class="solid-line" />
  </g>
  
</svg>
