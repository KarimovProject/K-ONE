<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16BCEB" stop-opacity="0.06" />
      <stop offset="50%" stop-color="#145CFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#FAFCFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#glow-center)" />

  <g stroke="#145CFF" stroke-width="1" stroke-opacity="0.04" fill="none">
    <!-- Subtle concentric circles -->
    <circle cx="800" cy="0" r="300" />
    <circle cx="800" cy="0" r="450" />
    <circle cx="800" cy="0" r="600" />

    <!-- Minimal connecting lines -->
    <line x1="0" y1="200" x2="1600" y2="200" />
    <line x1="800" y1="0" x2="200" y2="600" />
    <line x1="800" y1="0" x2="1400" y2="600" />
  </g>

  <g fill="#16BCEB" opacity="0.2">
    <circle cx="200" cy="200" r="2" />
    <circle cx="500" cy="200" r="1.5" />
    <circle cx="1100" cy="200" r="1.5" />
    <circle cx="1400" cy="200" r="2" />
    <circle cx="550" cy="400" r="1" />
    <circle cx="1050" cy="400" r="1" />
  </g>
</svg>
