<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glow-emerald" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flowing data pulse line -->
  <path class="pulse-line" d="M 0 300 Q 200 300, 400 200 T 800 250" fill="none" stroke="#16C784" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="8 8" />

  <g opacity="0.4">
    <!-- Active Venue Nodes -->
    <circle cx="200" cy="300" r="3" fill="#145CFF" />
    <circle cx="400" cy="200" r="4" fill="#16C784" filter="url(#glow-emerald)" />
    <circle cx="400" cy="200" r="2" fill="#FFFFFF" />
    <circle cx="600" cy="225" r="3" fill="#FFB020" />
  </g>
</svg>
