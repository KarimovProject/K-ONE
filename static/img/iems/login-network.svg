<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep premium background -->
    <radialGradient id="bg-grad" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#0A2244" />
      <stop offset="100%" stop-color="#071A33" />
    </radialGradient>

    <!-- Sophisticated luminous glows -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-light" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear route gradients -->
    <linearGradient id="route-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145CFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#16BCEB" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="route-violet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7659FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#145CFF" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="route-emerald" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#16C784" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#13C8B0" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg-grad)" />

  <!-- Abstract Global / Central Asia orbital architecture -->
  <g stroke="#ffffff" stroke-opacity="0.05" fill="none">
    <circle cx="200" cy="900" r="400" stroke-width="1" />
    <circle cx="200" cy="900" r="550" stroke-width="0.5" />
    <circle cx="200" cy="900" r="700" stroke-width="0.2" />
    <circle cx="800" cy="300" r="300" stroke-width="1" />
  </g>

  <!-- Luminous Route Lines -->
  <path d="M 0 500 C 300 500, 600 200, 1080 300" fill="none" stroke="url(#route-blue)" stroke-width="3" filter="url(#glow-light)" />
  <path d="M 200 1080 C 400 800, 500 500, 800 0" fill="none" stroke="url(#route-violet)" stroke-width="2" filter="url(#glow-light)" />
  <path d="M -100 800 C 400 900, 800 600, 1200 700" fill="none" stroke="url(#route-emerald)" stroke-width="1.5" />

  <!-- Central Connectivity Nodes -->
  <g filter="url(#glow-heavy)">
    <circle cx="620" cy="285" r="12" fill="#16BCEB" />
    <circle cx="455" cy="625" r="8" fill="#7659FF" />
    <circle cx="380" cy="840" r="6" fill="#16C784" />
  </g>

  <!-- Core bright centers -->
  <circle cx="620" cy="285" r="4" fill="#FFFFFF" />
  <circle cx="455" cy="625" r="3" fill="#FFFFFF" />
  <circle cx="380" cy="840" r="2" fill="#FFFFFF" />

  <!-- Secondary Nodes -->
  <circle cx="200" cy="500" r="3" fill="#145CFF" filter="url(#glow-light)" />
  <circle cx="800" cy="260" r="4" fill="#7659FF" filter="url(#glow-light)" />
  <circle cx="700" cy="660" r="2" fill="#16C784" filter="url(#glow-light)" />
</svg>
