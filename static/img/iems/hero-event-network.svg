<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Soft glows -->
    <filter id="glow-cobalt" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="grad-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145CFF" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#16BCEB" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7659FF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Flowing Orbital Lines -->
  <path d="M -100 350 C 200 150, 400 380, 800 200 S 1100 300, 1300 100" fill="none" stroke="url(#grad-line)" stroke-width="2" />
  <path d="M -50 150 C 300 250, 600 -50, 900 150 S 1150 250, 1300 50" fill="none" stroke="url(#grad-line)" stroke-width="1.5" />
  <path d="M 100 450 C 400 150, 700 250, 1000 50" fill="none" stroke="url(#grad-line)" stroke-width="3" />

  <!-- Subtle Scientific Grid -->
  <g stroke="#145CFF" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Glowing Event Nodes -->
  <!-- Node 1: Cobalt -->
  <circle cx="280" cy="225" r="4" fill="#145CFF" filter="url(#glow-cobalt)" />
  <circle cx="280" cy="225" r="2" fill="#FFFFFF" />

  <!-- Node 2: Cyan -->
  <circle cx="680" cy="115" r="5" fill="#16BCEB" filter="url(#glow-cyan)" />
  <circle cx="680" cy="115" r="2.5" fill="#FFFFFF" />

  <!-- Node 3: Violet -->
  <circle cx="950" cy="210" r="6" fill="#7659FF" filter="url(#glow-violet)" />
  <circle cx="950" cy="210" r="3" fill="#FFFFFF" />

  <!-- Network connections between nodes -->
  <line x1="280" y1="225" x2="680" y2="115" stroke="#16BCEB" stroke-opacity="0.1" stroke-dasharray="4 4" stroke-width="1.5" />
  <line x1="680" y1="115" x2="950" y2="210" stroke="#7659FF" stroke-opacity="0.15" stroke-dasharray="4 4" stroke-width="1.5" />
</svg>
